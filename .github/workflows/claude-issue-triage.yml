name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    # Evita bucles si un bot edita el issue
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required to add labels and post the diagnosis comment
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }} y haz el triaje completo. Responde siempre en español.

            1. Lee el issue completo: `gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments`
            2. Lista los labels disponibles con `gh label list` y asigna los que correspondan con
               `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               SOLO puedes usar labels que ya existen en el repositorio; nunca crees labels nuevos.
               Quita con --remove-label los labels previos que ya no apliquen tras una edición.
            3. Examina el código fuente relevante (game.js, index.html, style.css) para fundamentar el análisis.
            4. Redacta un diagnóstico general en español con estas secciones:
               - **Resumen**: qué reporta/pide el issue en 1-2 frases.
               - **Clasificación**: tipo (bug, mejora, pregunta, etc.) y labels asignados.
               - **Análisis técnico**: causa probable o área afectada, con referencias concretas
                 a archivos y funciones (p. ej. game.js: tryRotate(), dropInterval).
               - **Enfoque de solución sugerido**: pasos concretos de implementación para resolverlo.
               - **Complejidad estimada**: baja / media / alta.
            5. El comentario de diagnóstico debe empezar con el marcador HTML `<!-- claude-triage -->`.
               Busca en los comentarios del issue uno que contenga ese marcador:
               - Si existe, actualízalo:
                 `gh api repos/${{ github.repository }}/issues/comments/<comment_id> -X PATCH -f body="..."`
               - Si no existe, créalo:
                 `gh issue comment ${{ github.event.issue.number }} --body "..."`
            No modifiques ningún archivo del repositorio ni crees branches o PRs.
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api repos/*/issues/comments/*),Read,Grep,Glob"'
