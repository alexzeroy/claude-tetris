<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
        // un data-skin desconocido no matchea ningún CSS y game.js lo normaliza después
        var skin = localStorage.getItem('tetris.skin');
        if (skin && skin !== 'retro') document.documentElement.dataset.skin = skin;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">☀️ Claro</button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="stats-grid">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value" id="combo">–</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">HOLD <kbd>C</kbd></span>
          <canvas id="hold-canvas" width="120" height="90"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="90"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA <span id="energy-hint" class="hidden">· pulsa E</span></span>
          <div class="energy-track" id="energy-track">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">MODO</span>
          <select id="mode-select">
            <option value="normal">Normal</option>
            <option value="sprint">Sprint: 40 líneas / 2 min</option>
            <option value="basura">Basura creciente</option>
            <option value="obstaculos">Obstáculos</option>
            <option value="invisible">Invisible</option>
            <option value="inversa">Rotación inversa</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neón</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label objective" id="objective"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box ability-box">
        <p class="ability-title">HABILIDAD</p>
        <button data-ability="reveal">👁 Ver siguientes 5 piezas (20 s)</button>
        <button data-ability="swap">🔄 Cambiar pieza actual</button>
        <button data-ability="slow">🐢 Ralentizar tiempo (10 s)</button>
        <button data-ability="undo">↩️ Deshacer última colocación</button>
        <button id="ability-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
